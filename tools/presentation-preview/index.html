<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Recoil Crew — Presentation Preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1216; color: #d7edf3; font: 13px/1.4 system-ui, sans-serif; }
      #app { position: fixed; inset: 0; display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 48px 1fr; }
      header { grid-column: 1/4; display: flex; gap: 10px; align-items: center; padding: 0 12px; background: #142028; border-bottom: 1px solid #22333d; }
      header select, header button { background: #0d171d; color: #d7edf3; border: 1px solid #2a3f4a; border-radius: 6px; padding: 4px 8px; }
      header button.active { border-color: #56cdeb; }
      aside { padding: 10px; border-right: 1px solid #22333d; overflow: auto; }
      aside h3 { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #7fc9d8; }
      aside label { display: block; margin: 6px 0; }
      aside select, aside input { width: 100%; box-sizing: border-box; }
      #preview { position: relative; overflow: hidden; background: #0b1216; }
      #preview .screen { position: absolute; inset: 0; }
      #preview.stable * { animation: none !important; transition: none !important; }
      #hud-preview { position: absolute; inset: 0; pointer-events: none; }
      #hud-preview .hud { position: absolute; inset: 0; }
      #info { padding: 10px; border-left: 1px solid #22333d; overflow: auto; font: 11px/1.5 ui-monospace, monospace; color: #9fc4cf; }
      #info .ok { color: #4ddb6e; }
      #info .bad { color: #ff5a4a; }
      .tree { white-space: pre; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <span>PRESENTATION PREVIEW</span>
        <button id="tab-scene" class="active">Scene</button>
        <button id="tab-hud">HUD</button>
      </header>
      <aside id="controls"></aside>
      <main id="preview"></main>
      <section id="info"></section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
